<<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PLAY APP — Katalog aplikasi SURKUS DIGITAL</title>
<meta name="description" content="Katalog aplikasi resmi SURKUS DIGITAL. Lihat versi, catatan pembaruan, dan unduh APK.">
<meta name="theme-color" content="#080c16">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2300d9ae'/%3E%3Cpath d='M12 8.5v15l12-7.5z' fill='%2304201a' stroke='%2304201a' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
--bg:#080c16;--s1:#0f1524;--s2:#161d31;--s3:#1e2740;--line:rgba(255,255,255,.08);
--tx:#eef2ff;--mu:#9aa6c4;--fa:#6c7896;
--g1:#00e5a0;--g2:#00b8ff;--gold:#f5c76a;--grad:linear-gradient(135deg,#00e5a0,#00b8ff);
--ok:#00e5a0;--warn:#f5c76a;--bad:#ff5d73;
--logo-sm:48px;--logo-md:64px;--logo-lg:96px;
--r:20px;--rc:12px;--ease:cubic-bezier(.2,.8,.2,1);
--font-display:'Plus Jakarta Sans',system-ui,sans-serif;--font-body:'Plus Jakarta Sans',system-ui,sans-serif;
--shadow:0 20px 50px -20px rgba(0,229,160,.35)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 var(--font-body);-webkit-font-smoothing:antialiased;
background-image:radial-gradient(800px 400px at 90% -5%,rgba(0,184,255,.16),transparent 60%),radial-gradient(700px 400px at -10% 10%,rgba(0,229,160,.12),transparent 60%);background-attachment:fixed}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;line-height:1.15;letter-spacing:-.02em;font-weight:800}
p{margin:0}a{color:var(--g1);text-decoration:none}img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--g2);outline-offset:2px;border-radius:8px}
.wrap{width:100%;max-width:1180px;margin:0 auto;padding:0 20px}
#app{min-height:100dvh;display:flex;flex-direction:column}#app>#main,#app>.adm{flex:1 0 auto}
#main:has(.skel)~.foot{visibility:hidden}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);border-radius:var(--rc);padding:10px 18px;font-weight:700;cursor:pointer;background:var(--s2);color:var(--tx);min-height:44px;transition:.18s var(--ease);text-align:center}
.btn:hover:not(:disabled){background:var(--s3);transform:translateY(-1px)}
.btn:active:not(:disabled){scale:.97}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--grad);color:#021510;border:0;box-shadow:var(--shadow)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08);background:var(--grad)}
.btn.danger{background:var(--bad);color:#fff;border:0}
.btn.small{min-height:36px;padding:6px 12px;font-size:14px}
.btn.big{min-height:56px;padding:14px 28px;font-size:18px;border-radius:16px;letter-spacing:.04em}
.icon-btn{border:0;background:transparent;cursor:pointer;padding:8px;border-radius:10px;display:inline-grid;place-items:center}
.icon-btn:hover{background:rgba(255,255,255,.08)}
.ico{display:inline-flex;width:1.15em;height:1.15em}.ico svg{width:100%;height:100%}
.top{position:sticky;top:0;z-index:30;background:rgba(8,12,22,.78);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;gap:16px}
.brand{--mark:36px;display:flex;align-items:center;gap:10px;color:var(--tx)}
.foot .brand{--mark:30px}.login .brand{--mark:44px}.side .brand{--mark:32px}
.brand svg,.brand .bm{width:var(--mark);height:var(--mark);flex:none}
.brand .bm{width:auto;max-width:calc(var(--mark)*4);object-fit:contain;border-radius:calc(var(--mark)*.28)}
.brand b{font-weight:800;font-size:calc(var(--mark)*.55);letter-spacing:.02em;white-space:nowrap}
.brand b span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.nav{display:flex;gap:4px}.nav a{color:var(--mu);padding:8px 14px;border-radius:999px;font-weight:600;font-size:15px}
.nav a:hover,.nav a.on{background:rgba(255,255,255,.08);color:var(--tx)}
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.hero::before{content:"";position:absolute;width:560px;height:560px;right:-160px;top:-260px;background:radial-gradient(circle,rgba(0,229,160,.22),transparent 65%);animation:drift 16s ease-in-out infinite;pointer-events:none}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.15fr .85fr;gap:32px;align-items:center;padding-top:64px;padding-bottom:72px}
.hero h1{font-size:clamp(36px,6vw,68px);max-width:14ch;background:linear-gradient(180deg,#fff 30%,#a7ffe0);-webkit-background-clip:text;background-clip:text;color:transparent;animation:rise .8s var(--ease) both}
.hero .lead{margin-top:16px;color:var(--mu);font-size:18px;max-width:46ch;animation:rise .8s var(--ease) .1s both}
.search{margin-top:28px;display:flex;align-items:center;gap:10px;background:var(--s2);border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 18px;max-width:560px;transition:.2s;animation:rise .8s var(--ease) .2s both}
.search:focus-within{border-color:var(--g1);box-shadow:0 0 0 4px rgba(0,229,160,.18)}
.search .ico{color:var(--fa);font-size:22px}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:17px;padding:8px 0}
.search .btn{border-radius:999px}
.hero-facts{margin-top:20px;display:flex;gap:24px;color:var(--mu);flex-wrap:wrap;animation:rise .8s var(--ease) .3s both}
.hero-facts b{color:var(--gold);font-size:26px;font-weight:800}
.tiles{display:grid;grid-template-columns:repeat(3,var(--logo-lg));gap:22px;justify-content:center;transform:rotate(-7deg)}
.tiles>*:nth-child(n+4){transform:translateX(34px)}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;width:var(--logo-lg);color:var(--mu);font-size:13px;font-weight:600;text-align:center}
.tile span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .logo{animation:floaty 5.5s ease-in-out infinite;animation-delay:calc(var(--i,0)*-.9s)}
.ghost-tile{width:var(--logo-lg);height:var(--logo-lg);border-radius:27%;border:1.5px dashed rgba(255,255,255,.14)}
.logo{--s:var(--logo-md);width:var(--s);height:var(--s);font-size:calc(var(--s)*.4);flex:none;border-radius:24%;overflow:hidden;display:grid;place-items:center;color:#fff;font-weight:800;box-shadow:0 0 0 1px var(--line),0 12px 28px -12px rgba(0,0,0,.8)}
.logo.sz-sm{--s:var(--logo-sm)}.logo.sz-md{--s:var(--logo-md)}.logo.sz-lg{--s:var(--logo-lg)}
.logo img{width:100%;height:100%;object-fit:cover}
section.block{padding:44px 0 8px}
.block-h{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.block-h h2{font-size:clamp(24px,4vw,34px)}.block-h p{color:var(--mu);font-size:15px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 20px 10px;margin:0 -20px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip-btn{flex:none;border:1px solid var(--line);background:var(--s1);border-radius:999px;padding:8px 16px;font-weight:600;font-size:15px;cursor:pointer;display:inline-flex;gap:8px;align-items:center;transition:.18s}
.chip-btn small{color:var(--fa)}.chip-btn:hover{border-color:var(--g1)}
.chip-btn[aria-pressed="true"]{background:var(--grad);color:#021510;border-color:transparent}.chip-btn[aria-pressed="true"] small{color:#04382a}
.recent{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:16px;overflow-x:auto;padding:4px 20px 14px;margin:0 -20px;scroll-snap-type:x proximity}
.recent>*{scroll-snap-align:start}
.mini{display:flex;gap:14px;align-items:center;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px;transition:.2s}
.mini:hover{background:var(--s2);border-color:rgba(0,229,160,.4)}
.mini h3{font-size:17px;color:var(--tx)}.mini small{color:var(--mu);display:block;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{display:flex;gap:16px;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:18px;color:var(--tx);min-height:112px;transition:.2s var(--ease)}
.card:hover{transform:translateY(-4px);border-color:rgba(0,229,160,.45);box-shadow:var(--shadow)}
.card h3{font-size:19px}.card-body{min-width:0}
.card p{color:var(--mu);font-size:14.5px;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.tag{background:rgba(0,229,160,.12);color:var(--g1);border-radius:8px;padding:2px 9px;font-size:13px;font-weight:700}
.ver{font-size:13px;font-weight:700;color:var(--mu)}
.grid.enter>.card,.recent>.mini{animation:rise .5s var(--ease) backwards;animation-delay:calc(var(--i,0)*45ms)}
.empty,.errbox{border:1.5px dashed var(--line);border-radius:var(--r);padding:44px 20px;text-align:center;color:var(--mu);background:var(--s1)}
.empty h3,.errbox h3{color:var(--tx);font-size:20px;margin-bottom:6px}.errbox{border-color:rgba(255,93,115,.5)}.errbox .btn,.empty .btn{margin-top:14px}
.skel{height:112px;border-radius:var(--r);background:linear-gradient(90deg,var(--s1) 25%,var(--s2) 37%,var(--s1) 63%);background-size:400% 100%;animation:sh 1.3s infinite}
.spin{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.25);border-top-color:currentColor;border-radius:50%;animation:rot .7s linear infinite;display:inline-block}
.foot{margin-top:72px;border-top:1px solid var(--line);color:var(--fa);padding:30px 0;font-size:15px}
.foot .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
.back{display:inline-flex;gap:6px;align-items:center;margin:22px 0 14px;font-weight:600;color:var(--mu)}.back:hover{color:var(--g1)}
.d-head{display:flex;gap:24px;align-items:center;background:linear-gradient(135deg,var(--s2),var(--s1));border:1px solid var(--line);border-radius:24px;padding:28px;flex-wrap:wrap;position:relative;overflow:hidden;animation:rise .6s var(--ease) backwards}
.d-head::after{content:"";position:absolute;right:-80px;top:-80px;width:300px;height:300px;background:radial-gradient(circle,rgba(0,184,255,.22),transparent 70%);pointer-events:none}
.d-head h1{font-size:clamp(30px,5vw,48px)}.d-head .sub{color:var(--gold);font-weight:600;margin-top:6px}
.d-cta{margin-left:auto;display:flex;flex-direction:column;gap:8px;min-width:240px;position:relative;z-index:1}
.d-cta small{color:var(--mu);text-align:center;font-size:13px}
.dl-note{font-size:14px;text-align:center;color:var(--mu);min-height:20px}.dl-note a{text-decoration:underline}
.d-cols{display:grid;grid-template-columns:1fr 320px;gap:28px;margin-top:28px;align-items:start}
.panel{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.panel h2,.h-sec{font-size:24px;margin-bottom:12px}.panel+.panel{margin-top:18px}
.h-sec{margin:8px 0 12px}.panel .h-sec{margin-top:0}
.desc{white-space:pre-line;max-width:70ch;color:#cdd6f0}
.shots{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x proximity}
.shots button{flex:none;border:0;padding:0;background:var(--s2);border-radius:18px;overflow:hidden;cursor:zoom-in;width:clamp(150px,18vw,200px);aspect-ratio:9/16;scroll-snap-align:start}
.shots img{width:100%;height:100%;object-fit:cover;transition:transform .45s var(--ease)}.shots button:hover img{transform:scale(1.05)}
.info{display:grid;gap:12px}.info div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:10px;font-size:15px}
.info div:last-child{border:0;padding:0}.info dt{color:var(--mu)}.info dd{margin:0;font-weight:700;text-align:right}
.ver-item{border-top:1px solid var(--line);padding:16px 0}.ver-item:first-of-type{border:0;padding-top:0}
.ver-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.ver-top b{font-size:19px}.ver-top .when{color:var(--mu);font-size:14px}.ver-top .btn{margin-left:auto}
.badge{display:inline-block;border-radius:8px;padding:2px 9px;font-size:12.5px;font-weight:700}
.badge.ok{background:rgba(0,229,160,.15);color:var(--ok)}.badge.warn{background:rgba(245,199,106,.15);color:var(--warn)}
.badge.bad{background:rgba(255,93,115,.15);color:var(--bad)}.badge.blue{background:rgba(0,184,255,.15);color:var(--g2)}.badge.gray{background:var(--s3);color:var(--mu)}
.cl{margin:10px 0 0;padding-left:20px;color:#cdd6f0;font-size:15px}.cl li{margin:3px 0}.cl-p{margin-top:10px;color:#cdd6f0;font-size:15px;white-space:pre-line}
.lightbox{position:fixed;inset:0;z-index:90;background:rgba(4,6,12,.94);display:grid;place-items:center;padding:20px;cursor:zoom-out;animation:fadeIn .2s}
.lightbox img{max-height:92vh;max-width:96vw;border-radius:14px;animation:zoomIn .3s var(--ease)}.lightbox.closing{animation:fadeOut .17s forwards}
#toasts{position:fixed;z-index:120;right:16px;bottom:16px;left:16px;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{pointer-events:auto;max-width:440px;background:var(--s3);border:1px solid var(--line);border-left:4px solid var(--g2);border-radius:14px;padding:12px 16px;box-shadow:0 12px 36px -10px #000;font-size:15px;animation:rise .25s}
.toast.err{border-left-color:var(--bad)}.toast.ok{border-left-color:var(--ok)}.toast.out{animation:fadeOut .23s forwards}
.overlay{position:fixed;inset:0;z-index:100;background:rgba(4,6,12,.7);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;overflow:auto;animation:fadeIn .18s}
.modal{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);width:100%;max-width:480px;max-height:94dvh;display:flex;flex-direction:column;box-shadow:0 30px 80px -20px #000;animation:zoomIn .28s var(--ease)}
.modal.wide{max-width:660px}.modal-h{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 8px}.modal-h h3{font-size:21px}
.modal-b{padding:8px 20px 12px;overflow:auto}.modal-f{display:flex;gap:10px;justify-content:flex-end;padding:12px 20px 18px;flex-wrap:wrap}
.overlay.closing{animation:fadeOut .18s forwards;pointer-events:none}
.f{display:block;margin-bottom:14px}.f>span{display:block;font-weight:700;font-size:14.5px;margin-bottom:5px}.f small{display:block;color:var(--mu);font-size:13px;margin-top:4px}
.in{width:100%;min-height:44px;border:1px solid var(--line);background:var(--s2);border-radius:var(--rc);padding:10px 12px;color:var(--tx)}
.in:focus{outline:0;border-color:var(--g1);box-shadow:0 0 0 3px rgba(0,229,160,.18)}
.in option{background:var(--s2)}textarea.in{resize:vertical;min-height:90px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.check{display:flex;gap:10px;align-items:center;font-weight:600;margin-bottom:14px}.check input{width:20px;height:20px;accent-color:var(--g1)}
.res{border-radius:14px;padding:12px 14px;font-size:14.5px;margin-bottom:14px}.res ul{margin:6px 0 0;padding-left:18px}
.res.ok{background:rgba(0,229,160,.12);color:var(--ok)}.res.bad{background:rgba(255,93,115,.12);color:var(--bad)}.res.warn{background:rgba(245,199,106,.12);color:var(--warn)}
.notice{background:rgba(245,199,106,.12);color:var(--warn);border-radius:16px;padding:14px 16px;margin:16px 0}
.adm{min-height:100dvh;display:grid;grid-template-columns:250px 1fr}
.side{background:var(--s1);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100dvh}
.side .brand{padding:6px 10px 18px}.side nav{display:flex;flex-direction:column;gap:4px}
.nb{display:flex;align-items:center;gap:10px;border:0;background:transparent;color:var(--mu);padding:11px 12px;border-radius:12px;font-weight:600;cursor:pointer;text-align:left;width:100%;transition:.15s}
.nb:hover{background:rgba(255,255,255,.06);color:var(--tx)}.nb.on{background:var(--grad);color:#021510}
.side .spacer{flex:1}.who{padding:10px 12px;font-size:13.5px;color:var(--mu)}.who b{display:block;color:var(--tx);font-size:15px}
.am{padding:28px;min-width:0}.am h1{font-size:36px;margin-bottom:4px}.am .sub{color:var(--mu);margin-bottom:22px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}.bar .in{max-width:300px}.bar .grow{flex:1}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px;margin-bottom:22px}
.stat{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:18px;animation:rise .5s var(--ease) backwards;animation-delay:calc(var(--i,0)*55ms)}
.stat b{font-size:40px;font-weight:800;display:block;line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}.stat span{color:var(--mu);font-size:14.5px}
.list{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:grid;grid-template-columns:56px minmax(0,2.2fr) minmax(0,1fr) 110px 150px auto;gap:14px;align-items:center;padding:14px 16px;border-top:1px solid var(--line);transition:.15s}
.li:first-child{border-top:0}.li:not(.head):hover{background:var(--s2)}.li.head{color:var(--fa);font-size:13px;font-weight:700;padding-top:10px;padding-bottom:10px}
.li .nm{min-width:0}.li .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.li .nm small{color:var(--mu)}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.logline{display:grid;grid-template-columns:170px 150px 1fr;gap:12px;padding:12px 16px;border-top:1px solid var(--line);font-size:14.5px;align-items:start}
.logline:first-child{border-top:0}.logline .t{color:var(--mu);font-size:13px}
.vrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 0;border-top:1px solid var(--line)}.vrow:first-of-type{border:0}.vrow .vi{min-width:0;flex:1 1 220px}.vrow b{font-size:18px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.formgrid .full{grid-column:1/-1}
.prev{display:flex;gap:12px;align-items:center}.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.thumbs img{height:80px;border-radius:10px;border:1px solid var(--line)}
.login{min-height:100dvh;display:grid;place-items:center;padding:20px}
.login .box{width:100%;max-width:400px;background:var(--s1);border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:var(--shadow);animation:rise .6s var(--ease)}
.login .brand{margin-bottom:18px}.login h1{font-size:26px;margin-bottom:4px}.login .sub{color:var(--mu);margin-bottom:18px}
.pw{position:relative;display:block}.pw .icon-btn{position:absolute;right:4px;top:3px;color:var(--mu)}
.upl-row{display:flex;gap:10px;flex-wrap:wrap;margin:-4px 0 14px}
.upl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin:0 0 14px}
.upl-th,.upl-add{position:relative;aspect-ratio:9/16;border-radius:14px;overflow:hidden}
.upl-th{border:1px solid var(--line);background:var(--s2)}.upl-th img{width:100%;height:100%;object-fit:cover}
.upl-th button{position:absolute;top:6px;right:6px;width:30px;height:30px;border:0;border-radius:50%;background:rgba(0,0,0,.8);color:#fff;font-size:18px;cursor:pointer}
.upl-add{border:1.5px dashed var(--g1);background:rgba(0,229,160,.08);color:var(--g1);font-weight:700;cursor:pointer;display:grid;place-items:center;padding:8px;font-size:14px}
.logo-help{color:var(--mu);font-size:15px;margin:-4px 0 16px}
.logo-prev-bar{display:flex;align-items:center;background:var(--s2);border:1px solid var(--line);border-radius:var(--rc);padding:10px 14px}
.logo-prev-row{display:flex;gap:16px;align-items:center;margin:12px 0 16px;flex-wrap:wrap}

const $ = (s, r = document) => r.querySelector(s);

function el(tag, props, ...kids) {

  if (props) for (const [k, v] of Object.entries(props)) {

const ICONS = {

function icon(name) { const s = el('span', { class: 'ico', 'aria-hidden': 'true' }); s.innerHTML = ICONS[name] || ''; return s; }

const SITE = { logo: '' };
try { SITE.logo = localStorage.getItem('surkus_logo') || ''; } catch (e) {}
function defaultMark() {
  const d = document.createElement('div');
  d.innerHTML = '<svg viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="pa1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00e5a0"/><stop offset="1" stop-color="#00b8ff"/></linearGradient></defs><rect width="32" height="32" rx="9" fill="url(#pa1)"/><path d="M12 8.5v15l12-7.5z" fill="#04201a" stroke="#04201a" stroke-width="2" stroke-linejoin="round"/></svg>';
  return d.firstChild;
}
function brandMark() {
  const u = safeUrl(SITE.logo);
  if (!u) return defaultMark();
  const i = el('img', { class: 'bm', src: u, alt: '', referrerpolicy: 'no-referrer' });
  i.addEventListener('error', () => i.replaceWith(defaultMark()));
  return i;
}
function setFavicon() {
  const l = document.querySelector('link[rel="icon"]'); if (!l) return;
  if (!l.dataset.d) l.dataset.d = l.href;
  l.href = safeUrl(SITE.logo) || l.dataset.d;
}
function applySite(st) {
  const u = (st && st.site_logo) || '';
  try { u ? localStorage.setItem('surkus_logo', u) : localStorage.removeItem('surkus_logo'); } catch (e) {}
  if (u === SITE.logo) return;
  SITE.logo = u; setFavicon();
  document.querySelectorAll('.brand').forEach(b => { const o = b.firstElementChild; if (o) o.replaceWith(brandMark()); });
}
function brand() { return el('span', { class: 'brand' }, brandMark(), el('b', null, 'PLAY ', el('span', null, 'APP'))); }

function safeUrl(u) {
  try { const x = new URL(String(u || '')); return x.protocol === 'https:' ? x.href : ''; } catch (e) { return ''; }
}
setFavicon();
const fmtDate = iso => { const d = new Date(iso); return isNaN(d) ? '-' : new Intl.DateTimeFormat('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }).format(d); };
const fmtDateTime = iso => { const d = new Date(iso); return isNaN(d) ? '-' : new Intl.DateTimeFormat('id-ID', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }).format(d); };
function relDate(iso) {
  const d = new Date(iso); if (isNaN(d)) return '-';
  const days = Math.floor((Date.now() - d.getTime()) / 86400000);
  if (days <= 0) return 'hari ini'; if (days === 1) return 'kemarin'; if (days < 30) return days + ' hari lalu';
  return fmtDate(iso);
}
function toLocalInput(iso) {
  if (!iso) return ''; const d = new Date(iso); if (isNaN(d)) return '';
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}
const fromLocalInput = v => v ? new Date(v).toISOString() : '';
function hue(name) { let h = 0; for (const c of String(name)) h = (h * 31 + c.charCodeAt(0)) % 360; return 150 + (h % 90); }

function logoTile(app, size) {
  const sz = typeof size === 'number' ? (size <= 52 ? 'sm' : size <= 72 ? 'md' : 'lg') : (size || 'md');
  const box = el('span', { class: 'logo sz-' + sz });
  const initials = () => { box.replaceChildren(String(app.nama || '?').trim().slice(0, 2).toUpperCase()); box.style.background = `linear-gradient(135deg,hsl(${hue(app.nama)} 75% 45%),hsl(${hue(app.nama) + 30} 70% 28%))`; };
  const u = safeUrl(app.logo_url);
  if (u) {
    const img = el('img', { src: u, alt: '', loading: 'lazy', referrerpolicy: 'no-referrer' });
    img.addEventListener('error', initials);
    box.append(img); box.style.background = '#fff';
  } else initials();
  return box;
}

function toast(msg, kind, ms) {
  const t = el('div', { class: 'toast ' + (kind || ''), role: kind === 'err' ? 'alert' : 'status' }, msg);
  $('#toasts').append(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 230); }, ms || (kind === 'err' ? 7000 : 3500));
}
function spinner() { return el('span', { class: 'spin', 'aria-hidden': 'true' }); }
function countUp(root) {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  root.querySelectorAll('[data-n]').forEach(b => {
    const n = Number(b.dataset.n); if (!(n > 0)) return;
    const t0 = performance.now(), dur = 700;
    (function f(t) { const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3); b.textContent = String(Math.round(n * e)); if (k < 1) requestAnimationFrame(f); })(t0);

function openModal({ title, body, actions, wide }) {
  const prev = document.activeElement;
  const close = () => { if (overlay.classList.contains('closing')) return; document.removeEventListener('keydown', onKey); overlay.classList.add('closing'); setTimeout(() => overlay.remove(), 180); if (prev && prev.focus) prev.focus(); };

  const overlay = el('div', { class: 'overlay', onclick: e => { if (e.target === overlay) close(); } },
    el('div', { class: 'modal' + (wide ? ' wide' : ''), role: 'dialog', 'aria-modal': 'true', 'aria-label': title },
      el('div', { class: 'modal-h' }, el('h3', { text: title }), el('button', { class: 'icon-btn', 'aria-label': 'Tutup', onclick: close }, icon('x'))),
      el('div', { class: 'modal-b' }, body),

  return new Promise(res => {

    const m = openModal({
      title, body: el('p', { text: message }),
      actions: close => [
        btn('Batal', { onClick: () => { done = true; close(); res(false); } }),
        btn(confirmText || 'Lanjutkan', { kind: danger ? 'danger' : 'primary', onClick: () => { done = true; close(); res(true); } })]

/* ------------------------------ API ------------------------------ */
class ApiError extends Error { constructor(m, code) { super(m); this.code = code; } }
const A = { token: '' };

function saveToken(t) { A.token = t || ''; try { t ? sessionStorage.setItem('surkus_admin_token', t) : sessionStorage.removeItem('surkus_admin_token'); } catch (e) {} }

async function call(action, params, admin) {
  if (!API_URL) throw new ApiError('URL backend belum diatur. Isi konstanta API_URL di bagian atas script pada index.html.', 'NO_API');
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 45000);
  let res;
  try {
    if (admin) {
      res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action, token: A.token }, params || {})), signal: ctl.signal });
    } else {
      const u = new URL(API_URL); u.searchParams.set('action', action);
      Object.entries(params || {}).forEach(([k, v]) => { if (v !== undefined && v !== null && v !== '') u.searchParams.set(k, v); });
      res = await fetch(u.toString(), { signal: ctl.signal });
    }
  } catch (e) {
    throw new ApiError(e.name === 'AbortError' ? 'Server terlalu lama menjawab. Coba lagi.' : 'Tidak dapat terhubung ke server. Periksa koneksi internet atau URL Web App.', 'NETWORK');
  } finally { clearTimeout(timer); }
  let data;
  try { data = await res.json(); } catch (e) { throw new ApiError('Jawaban server tidak dapat dibaca. Pastikan Web App di-deploy dengan akses "Anyone".', 'BAD_RESPONSE'); }
  if (!data.ok) {
    if (data.code === 'AUTH' && admin) { saveToken(''); if (ADM.user) { ADM.user = null; renderAdmin('Sesi berakhir. Silakan login kembali.'); } }
    throw new ApiError(data.error || 'Terjadi kesalahan.', data.code);
  }
  return data.data;
}
const pub = (a, p) => call(a, p, false);
const adm = (a, p) => call(a, p, true);

/* ------------------------------ router ------------------------------ */
function go(href, replace) {
  history[replace ? 'replaceState' : 'pushState']({}, '', href);

}

  const a = e.target.closest && e.target.closest('a[data-nav]');

function route() {
  const q = new URLSearchParams(location.search);
  if (location.hash !== '#semua') window.scrollTo(0, 0);
  if (isAdminRoute()) return renderAdmin();
  if (q.get('app')) return renderDetail(q.get('app'));
  return renderHome();

const P = { data: null, q: '', cat: '', t: 0 };

  document.title = 'PLAY APP — Katalog aplikasi SURKUS DIGITAL';

async function startDownload(app, version, button, noteEl) {

/* ---------------- Upload logo & screenshot dari perangkat ---------------- */
(function () {
  const MAX_SHOTS = 10;
  window.surkusUpload = (f, k) => upload(f, k); window.surkusPicker = (m, cb) => picker(m, cb);
  function shrink(file, max, mime) {
    return new Promise((ok, no) => {
      const url = URL.createObjectURL(file), img = new Image();
      img.onload = () => {
        const iw = img.naturalWidth || max, ih = img.naturalHeight || max;
        const k = Math.min(1, max / Math.max(iw, ih)), c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(iw * k)); c.height = Math.max(1, Math.round(ih * k));
        const x = c.getContext('2d');
        if (mime === 'image/jpeg') { x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); }
        x.drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
        ok(c.toDataURL(mime, .86).split(',')[1]);
      };
      img.onerror = () => { URL.revokeObjectURL(url); no(new Error('File bukan gambar yang valid.')); };
      img.src = url;
    });
  }
  async function upload(file, kind) {
    const mime = kind === 'logo' ? 'image/png' : 'image/jpeg';
    try { return (await adm('uploadImage', { mime, data: await shrink(file, kind === 'logo' ? 512 : 1400, mime) })).url; }
    catch (e) { throw new Error(/tidak dikenal/i.test(e.message) ? 'Backend belum diperbarui: tambahkan fungsi uploadImage ke Code.gs lalu deploy versi baru.' : e.message); }
  }
  function picker(multi, onFiles) {
    const i = el('input', { type: 'file', accept: 'image/*', multiple: multi, style: { display: 'none' } });
    i.addEventListener('change', () => { if (i.files.length) onFiles([...i.files]); i.remove(); });
    document.body.append(i); i.click();
  }
  function relabel(label, title, hint) {
    const s = label.querySelector('span'), h = label.querySelector('small');
    if (s) s.textContent = title; if (h) h.textContent = hint;
  }
  function enhanceLogo(inp) {
    inp.dataset.up = 1; inp.style.display = 'none';
    const label = inp.closest('label'); relabel(label, 'Logo aplikasi', 'Pilih foto dari galeri atau file di perangkat. Kosong = inisial otomatis.');
    const pick = btn('Pilih logo dari perangkat', { kind: 'primary', small: true, icon: 'plus' });
    const del = btn('Hapus logo', { small: true });
    pick.addEventListener('click', () => picker(false, async ([f]) => {
      const old = pick.textContent; pick.disabled = true; pick.textContent = 'Mengunggah…';
      try { inp.value = await upload(f, 'logo'); inp.dispatchEvent(new Event('change')); toast('Logo terunggah. Klik Simpan untuk menyimpan.', 'ok'); }
      catch (e) { toast(e.message, 'err'); } finally { pick.disabled = false; pick.textContent = old; }
    }));
    del.addEventListener('click', () => { inp.value = ''; inp.dispatchEvent(new Event('change')); });
    label.after(el('div', { class: 'upl-row' }, pick, del));
  }
  function enhanceShots(ta) {
    ta.dataset.up = 1; ta.style.display = 'none';
    const label = ta.closest('label'); relabel(label, 'Screenshot aplikasi (maksimal 10)', 'Pilih beberapa foto sekaligus dari perangkat. Klik × untuk menghapus.');
    const old = label.nextElementSibling; if (old && old.classList.contains('thumbs')) old.style.display = 'none';
    const grid = el('div', { class: 'upl-grid' });
    const urls = () => ta.value.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
    const set = a => { ta.value = a.join('\n'); ta.dispatchEvent(new Event('change')); draw(); };
    function draw() {
      const a = urls();
      grid.replaceChildren(...a.map((u, i) => el('div', { class: 'upl-th' },
        el('img', { src: u, alt: 'Screenshot ' + (i + 1), referrerpolicy: 'no-referrer' }),
        el('button', { type: 'button', 'aria-label': 'Hapus screenshot ' + (i + 1), onclick: () => { a.splice(i, 1); set(a); } }, '×'))),
        a.length < MAX_SHOTS ? el('button', { type: 'button', class: 'upl-add', onclick: add }, '+ Tambah foto') : null);
    }
    function add() {
      picker(true, async files => {
        const a = urls(); const room = MAX_SHOTS - a.length;
        if (files.length > room) toast('Hanya ' + room + ' foto lagi yang bisa ditambahkan.', 'err');
        for (const f of files.slice(0, room)) {
          try { toast('Mengunggah ' + f.name + '…'); a.push(await upload(f, 'shot')); set(a); }
          catch (e) { toast(e.message, 'err'); break; }
        }
        toast('Selesai. Klik Simpan untuk menyimpan.', 'ok');
      });
    }
    label.after(grid); draw();
  }
  new MutationObserver(() => {
    const l = document.querySelector('input.in[placeholder*="logo.png"]'); if (l && !l.dataset.up) enhanceLogo(l);
    const s = document.querySelector('textarea.in[placeholder*="Satu URL gambar"]'); if (s && !s.dataset.up) enhanceShots(s);
  }).observe(document.body, { childList: true, subtree: true });
})();

/* ---------------- Menu bawah ala Play Store (HP, halaman publik) ---------------- */
(function () {
  const mk = (k, t, href, ic) => el('a', { href, 'data-k': k, 'data-nav': '' }, icon(ic), el('span', null, t));
  const bn = el('nav', { class: 'bn', 'aria-label': 'Menu bawah' }, mk('home', 'Beranda', BASE, 'grid'), mk('all', 'Aplikasi', BASE + '#semua', 'box'));
  document.body.append(bn);
  function sync() {
    const q = new URLSearchParams(location.search), a = isAdminRoute();
    document.body.classList.toggle('pm', !a);
    bn.querySelectorAll('a').forEach(x => x.classList.toggle('on', x.dataset.k === (a ? 'adm' : q.get('app') ? '' : (location.hash === '#semua' ? 'all' : 'home'))));
  }
  ['pushState', 'replaceState'].forEach(f => { const o = history[f]; history[f] = function () { const r = o.apply(this, arguments); sync(); return r; }; });
  addEventListener('popstate', sync); sync();
  addEventListener('hashchange', () => { if (location.hash === '#admin') route(); sync(); });
  let ly = scrollY;
  addEventListener('scroll', () => { const y = scrollY, d = y - ly; if (Math.abs(d) < 8) return; document.body.classList.toggle('nav-hide', d > 0 && y > 80); ly = y; }, { passive: true });
})();
</script>
